# A sample job for sdp_dimensions_example.

resources:
  jobs:
    sample_job:
      name: sample_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}

      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../src/generate_data/generate-dummy-data.ipynb

        - task_key: refresh_pipeline
          depends_on:
            - task_key: generate_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.sdp_dimensions_example_etl.id}


      environments:
        - environment_key: default
          spec:
            environment_version: "2"
